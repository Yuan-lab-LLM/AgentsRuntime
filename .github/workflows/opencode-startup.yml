name: OpenCode startup tests

on:
  push:
    paths:
      - 'opencode/**'
      - 'opencode/lite/**'
      - '.github/workflows/opencode-startup.yml'
  pull_request:
    paths:
      - 'opencode/**'
      - 'opencode/lite/**'
      - '.github/workflows/opencode-startup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test Lite container and gateway startup
        run: node opencode/tests/start-opencode-web.test.mjs
